[project]
name = "md2audio"
version = "0.1.0"
description = "Convert markdown files to audio with subtitles and video using Edge or offline VITS TTS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["md2audio", "md2audio_dialogue", "md2audio_local"]

[project.scripts]
md2audio = "md2audio:main"
